<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ccNexus</title>
    <link rel="stylesheet" href="/ui/css/main.css">
    <link rel="stylesheet" href="/ui/css/components.css">
    <link rel="stylesheet" href="/ui/css/themes.css">
</head>
<body>
    <a class="skip-link" href="#content" data-i18n="common.skipToContent">跳到主要内容</a>
    <div id="app">
        <header class="app-header">
            <div class="brand-block">
                <h1><span aria-hidden="true">🚀</span> ccNexus</h1>
                <p id="app-subtitle">AI 代理管理</p>
            </div>
            <div class="header-actions">
                <button class="port-display" id="port-settings-btn" type="button">
                    <span id="port-label">端口</span>
                    <span class="port-number" id="proxy-port">-</span>
                </button>
                <button class="header-link" id="lang-toggle" type="button" title="切换语言 / Switch Language" aria-label="切换语言 / Switch Language">
                    <span aria-hidden="true">中</span>
                </button>
                <button class="header-link" id="theme-toggle" type="button" aria-label="切换主题">
                    <span aria-hidden="true">◐</span>
                </button>
                <button class="header-link" id="settings-btn" type="button" aria-label="设置">
                    <span aria-hidden="true">⚙</span>
                </button>
            </div>
        </header>

        <main id="content" class="app-container" tabindex="-1">
            <section class="card app-section" id="statistics-panel" aria-live="polite"></section>
            <section class="card app-section" id="endpoints-panel" aria-live="polite"></section>
        </main>

        <footer class="app-footer">
            <span>© 2025 ccNexus</span>
            <span class="footer-status" id="realtime-status"></span>
            <span>Server WebUI</span>
        </footer>
    </div>

    <div id="modal-container" aria-live="polite"></div>
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/ui/js/main.js"></script>
</body>
</html>
